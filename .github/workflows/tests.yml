name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  skillloop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install gitcg numpy pytest
      - name: Skill layer unit tests (engine-free)
        run: python -m pytest -q tests/test_skill_library.py tests/test_skill_gate.py tests/test_skill_agent.py
